# agents-master 配置
# 模型可随时换：loop 只依赖 OpenAI 兼容接口，key 只走环境变量 DEEPSEEK_API_KEY（.env）

[llm]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"

# 放权档位：readonly = 只读视野，无写无执行；supervised = 写/执行逐项审批（v1 默认）；
# workspace = 授权目录内写与命令自动执行，越界仍逐项审批
# 界面里切换的档位会写入预览数据目录的覆盖文件，此处是默认值；调宽档位是用户的明确操作
[delegation]
level = "supervised"

# 项目注册表：path 是两个 CLI 共享的工作区
# summary 供主 Agent 的 list_projects 展示；delegable = true 才允许 delegate_cli 真实执行
# （预览 worker --executor cli 的白名单即 delegable 项目），阅读范围含全部注册项目
[[projects]]
name = "agents-master"
path = "/home/vinci/projects/agents-master"
summary = "本产品自身：通用个人 Agent。产品原则 docs/product-discovery-v0.md，进度 docs/roadmap.md"
delegable = true

[[projects]]
name = "stock_data"
path = "/home/vinci/projects/stock_data"
summary = "股票数据项目"
delegable = true

# 合成验收沙箱：仅供预览 CLI 执行的端到端验证，不含真实数据
[[projects]]
name = "sandbox"
path = "/home/vinci/projects/agents-sandbox"
summary = "合成验收沙箱"
delegable = true

# 项目发现根：其下一级目录自动成为主 Agent 的可读项目（只读视野）；
# 可执行范围仍仅由上面 [[projects]] 的 delegable 决定，发现的项目不能委派
[workspace]
roots = ["/home/vinci/projects"]

# 驱动 codex 时的沙箱模式（安全相关默认值，改这里要过用户）
[backends.codex]
sandbox_mode = "workspace-write"

[backends.kimi]
# kimi 的 --prompt 与 --yolo 不兼容，自治执行靠它自己的配置文件

# Claude 的非交互编码任务默认只自动接受工作区内的文件编辑。它不等同于
# bypassPermissions：命令和更广泛权限仍不会被一并批准。只有用户明确授权时才可放宽。
[backends.claude]
permission_mode = "acceptEdits"
